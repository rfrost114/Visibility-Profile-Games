version: 1
author: "The League Team"
gamerule:
  game:
    max_time: 100
    interaction:
      tagging: both_kill
      capture: kill
      prioritize: capture
    payoff:
      model: v1
      constants:
        k: 0.5
  agents:
    attacker_global:
      speed: 1
      capture_radius: 1        
      sensors: ["map", "agent", "neighbor"]
    defender_global:
      speed: 1
      capture_radius: 1        
      sensors: ["map", "agent", "neighbor"]

